<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz do Amor 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
  <!-- Efeito Visual de Fundo -->
  <div class="bg-glow"></div>
  <div class="hearts-bg" id="heartsBg"></div>

  <main class="container">
    <header>
      <div class="badge-icon">💖</div>
      <h1>Nosso Quiz</h1>
      <p class="subtitle">Para a Minha Paçoquinha 🥜✨</p>
    </header>

    <!-- TELA INICIAL / CRIAR OU ENTRAR -->
    <div class="card" id="home">
      <label for="name">Seu Nome / Apelido</label>
      <input type="text" id="name" placeholder="Ex: Amor, Paçoquinha..." autocomplete="off">

      <div class="actions">
        <button onclick="createRoom()">✨ Criar Sala</button>
        <button class="secondary" onclick="showJoin()">🔑 Entrar em Sala</button>
      </div>

      <div id="joinBox" hidden style="margin-top: 16px;">
        <label for="roomCode">Código da Sala</label>
        <input type="text" id="roomCode" placeholder="Ex: 1234" maxlength="6" style="text-transform: uppercase;">
        <button onclick="joinRoom()" style="width: 100%; margin-top: 10px;">Entrar no Jogo 💕</button>
      </div>

      <div id="error" class="error" hidden></div>
    </div>

    <!-- SALA DE ESPERA -->
    <div class="card" id="room" hidden>
      <div class="status">Aguardando Parceiro(a)...</div>
      <p style="text-align: center; margin-top: 10px; color: var(--text-muted); font-size: 0.95rem;">
        Compartilhe este código para jogarem juntos:
      </p>
      <div class="room-code" id="bigCode">----</div>

      <label>Jogadores Conectados:</label>
      <ul id="players"></ul>

      <button id="startBtn" onclick="startGame()" style="width: 100%;" hidden>Iniciar Jogo! 🚀</button>
    </div>

    <!-- TELA PRINCIPAL DO JOGO -->
    <div class="card" id="game" hidden>
      <div class="game-header">
        <span class="status" id="status">Rodada 1</span>
      </div>

      <h2 class="question-title" id="question">Carregando Pergunta...</h2>

      <!-- FASE 1: RESPONDER -->
      <div id="answerPhase">
        <label for="answer">Sua Resposta Sincera:</label>
        <textarea id="answer" placeholder="Escreva aqui sua resposta..."></textarea>
        <button onclick="submitAnswer()" style="width: 100%;">Enviar Resposta 💌</button>
      </div>

      <!-- FASE 2: ADIVINHAR -->
      <div id="guessPhase" hidden>
        <label for="guess">Qual você acha que foi a resposta do seu par?</label>
        <textarea id="guess" placeholder="Acho que a Paçoquinha respondeu..."></textarea>
        <button onclick="submitGuess()" style="width: 100%;">Enviar Palpite 🧠💖</button>
      </div>

      <!-- FASE 3: RESULTADOS DA RODADA -->
      <div id="resultPhase" hidden>
        <h3 style="text-align: center; color: var(--primary); font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 15px;">
          Resultado da Rodada 🎉
        </h3>
        <div id="results"></div>
        <button id="nextBtn" onclick="nextRound()" style="width: 100%;" hidden>Próxima Rodada ➡️</button>
      </div>

      <div class="message" id="gameMessage"></div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
